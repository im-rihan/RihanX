      rihanx.world.info: true
      rihanx.world.seed: true
      rihanx.world.weather: true
      rihanx.world.difficulty: true
      rihanx.world.time: true
      rihanx.world.border: true
      rihanx.world.spawn: true
      rihanx.world.setspawn: true
  rihanx.world.info:
    default: true
  rihanx.world.seed:
    default: op
  rihanx.world.weather:
    default: op
  rihanx.world.difficulty:
