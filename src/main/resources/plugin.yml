name: RihanX
version: '${project.version}'
main: com.rihanx.RihanX
api-version: '1.21'
description: Production-ready Paper utility suite — slime, world, find, chunk, teleport, player, inventory, items, search, and performance tools.
author: Rihan
website: https://github.com/im-rihan/RihanX
folia-supported: false
load: POSTWORLD
softdepend: [PlaceholderAPI]

commands:
  rihanx:
    description: RihanX root command. Use /rx help for modules.
    usage: /rihanx <module> [args...]
    permission: rihanx.use
    aliases: [rx, rihan]
  slime:
    description: Slime chunk tools (also /rx slime).
    usage: /slime [nearest|search|density|map|tp] [args...]
    permission: rihanx.slime
  world:
    description: World info and control (also /rx world).
    usage: /world <info|seed|weather|difficulty|time|border|spawn|setspawn> [args...]
    permission: rihanx.world
  find:
    description: Locate biomes and structures (also /rx find).
    usage: /find <biome|structure> <name>
    permission: rihanx.find
  chunk:
    description: Chunk tools (also /rx chunk).
    usage: /chunk <info|load|unload|regenerate|border|entities|tileentities>
    permission: rihanx.chunk
  rxtp:
    description: Teleport utilities (also /rx tp). Named /rxtp so vanilla /tp still works.
    usage: /rxtp <pos|player|world|biome|structure|chunk|random|safe|back> [args...]
    permission: rihanx.tp
  back:
    description: Return to previous location (also /rx tp back / /rx back).
    usage: /back
    permission: rihanx.tp.back
  player:
    description: Player utilities (also /rx player).
    usage: /player <info|heal|feed|fly|god|gamemode|speed|freeze|unfreeze|vanish|cleareffects|ping> [args...]
    permission: rihanx.player
  inventory:
    description: Inventory tools (also /rx inventory).
    usage: /inventory <see|ender|clear|repair> [player]
    permission: rihanx.inventory
    aliases: [inv]
  item:
    description: Item tools (also /rx item).
    usage: /item <info|give|rename|lore|enchant|repair> [args...]
    permission: rihanx.item
  search:
    description: Block and structure search (also /rx search).
    usage: /search <slime|cave|lava|water|spawner|village> [radius]
    permission: rihanx.search
  server:
    description: Server info (also /rx server).
    usage: /server <info|tps|mspt|memory|uptime>
    permission: rihanx.server
  performance:
    description: Performance reports (also /rx performance).
    usage: /performance <chunks|entities>
    permission: rihanx.performance
    aliases: [perf]
  protect:
    description: World/region protection (also /rx protect).
    usage: /protect <flag|flags|wand|pos1|pos2|define|...> [args...]
    permission: rihanx.protect
    aliases: [guard]
  edit:
    description: WorldEdit-lite tools (also /rx edit).
    usage: /edit <wand|pos1|pos2|set|replace|copy|paste|undo|...> [args...]
    permission: rihanx.edit
    aliases: [we]
  admin:
    description: Admin tools (also /rx admin).
    usage: /admin <reload|debug|cache|config|cancel>
    permission: rihanx.admin
  fly:
    description: Toggle your flight (optional player). Only affects the chosen player.
    usage: /fly [player]
    permission: rihanx.player.fly
  god:
    description: Toggle your god mode (optional player). Only affects the chosen player.
    usage: /god [player]
    permission: rihanx.player.god
  heal:
    description: Heal yourself (optional player).
    usage: /heal [player]
    permission: rihanx.player.heal
  feed:
    description: Feed yourself (optional player).
    usage: /feed [player]
    permission: rihanx.player.feed
  vanish:
    description: Toggle your vanish (self only).
    usage: /vanish
    permission: rihanx.player.vanish
  gm:
    description: Set your gamemode (optional player).
    usage: /gm <survival|creative|adventure|spectator> [player]
    permission: rihanx.player.gamemode
  home:
    description: Teleport to a home (also /rx home).
    usage: /home [name]
    permission: rihanx.home
  sethome:
    description: Set a home.
    usage: /sethome [name]
    permission: rihanx.home.set
  delhome:
    description: Delete a home.
    usage: /delhome [name]
    permission: rihanx.home.delete
  homes:
    description: List your homes.
    usage: /homes
    permission: rihanx.home.list
  warp:
    description: Teleport to a warp (also /rx warp).
    usage: /warp <name>
    permission: rihanx.warp
  setwarp:
    description: Set a server warp.
    usage: /setwarp <name>
    permission: rihanx.warp.set
  delwarp:
    description: Delete a server warp.
    usage: /delwarp <name>
    permission: rihanx.warp.delete
  warps:
    description: List warps.
    usage: /warps
    permission: rihanx.warp.list
  tpa:
    description: Request to teleport to a player.
    usage: /tpa <player>
    permission: rihanx.tpa
  tpahere:
    description: Request a player to teleport to you.
    usage: /tpahere <player>
    permission: rihanx.tpa.here
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept
    permission: rihanx.tpa.accept
  tpdeny:
    description: Deny a teleport request.
    usage: /tpdeny
    permission: rihanx.tpa.deny
  tpcancel:
    description: Cancel your outgoing teleport request.
    usage: /tpcancel
    permission: rihanx.tpa.cancel
  kit:
    description: Claim a kit.
    usage: /kit <name>
    permission: rihanx.kit
  kits:
    description: List kits.
    usage: /kits
    permission: rihanx.kit.list

