name: RihanX
version: '${project.version}'
main: com.rihanx.RihanX
api-version: '1.21'
description: Production-ready Paper utility suite — slime, world, find, chunk, teleport, player, inventory, items, search, and performance tools.
author: Rihan
website: https://github.com/im-rihan/RihanX
folia-supported: false
load: POSTWORLD
softdepend: [PlaceholderAPI]

commands:
  rihanx:
    description: RihanX root command. Use /rx help for modules.
    usage: /rihanx <module> [args...]
    permission: rihanx.use
    aliases: [rx, rihan]
  slime:
    description: Slime chunk tools (also /rx slime).
    usage: /slime [nearest|search|density|map|tp] [args...]
    permission: rihanx.slime
  world:
    description: World info and control (also /rx world).
    usage: /world <info|seed|weather|difficulty|time|border|spawn|setspawn> [args...]
    permission: rihanx.world
  find:
    description: Locate biomes and structures (also /rx find).
    usage: /find <biome|structure> <name>
    permission: rihanx.find
  chunk:
    description: Chunk tools (also /rx chunk).
    usage: /chunk <info|load|unload|regenerate|border|entities|tileentities>
    permission: rihanx.chunk
  rxtp:
    description: Teleport utilities (also /rx tp). Named /rxtp so vanilla /tp still works.
    usage: /rxtp <pos|player|world|biome|structure|chunk|random|safe|back> [args...]
    permission: rihanx.tp
  back:
    description: Return to previous location (also /rx tp back / /rx back).
    usage: /back
    permission: rihanx.tp.back
  player:
    description: Player utilities (also /rx player).
    usage: /player <info|heal|feed|fly|god|gamemode|speed|freeze|unfreeze|vanish|cleareffects|ping> [args...]
    permission: rihanx.player
  inventory:
    description: Inventory tools (also /rx inventory).
    usage: /inventory <see|ender|clear|repair> [player]
    permission: rihanx.inventory
    aliases: [inv]
  item:
    description: Item tools (also /rx item).
    usage: /item <info|give|rename|lore|enchant|repair> [args...]
    permission: rihanx.item
  search:
    description: Block and structure search (also /rx search).
    usage: /search <slime|cave|lava|water|spawner|village> [radius]
    permission: rihanx.search
  server:
    description: Server info (also /rx server).
    usage: /server <info|tps|mspt|memory|uptime>
    permission: rihanx.server
  performance:
    description: Performance reports (also /rx performance).
    usage: /performance <chunks|entities>
    permission: rihanx.performance
    aliases: [perf]
  protect:
    description: World/region protection (also /rx protect).
    usage: /protect <flag|flags|wand|pos1|pos2|define|...> [args...]
    permission: rihanx.protect
    aliases: [guard]
  edit:
    description: WorldEdit-lite tools (also /rx edit).
    usage: /edit <wand|pos1|pos2|set|replace|copy|paste|undo|...> [args...]
    permission: rihanx.edit
    aliases: [we]
  admin:
    description: Admin tools (also /rx admin).
    usage: /admin <reload|debug|cache|config|cancel>
    permission: rihanx.admin
  fly:
    description: Toggle your flight (optional player). Only affects the chosen player.
    usage: /fly [player]
    permission: rihanx.player.fly
  god:
    description: Toggle your god mode (optional player). Only affects the chosen player.
    usage: /god [player]
    permission: rihanx.player.god
  heal:
    description: Heal yourself (optional player).
    usage: /heal [player]
    permission: rihanx.player.heal
  feed:
    description: Feed yourself (optional player).
    usage: /feed [player]
    permission: rihanx.player.feed
  vanish:
    description: Toggle your vanish (self only).
    usage: /vanish
    permission: rihanx.player.vanish
  gm:
    description: Set your gamemode (optional player).
    usage: /gm <survival|creative|adventure|spectator> [player]
    permission: rihanx.player.gamemode
  home:
    description: Teleport to a home (also /rx home).
    usage: /home [name]
    permission: rihanx.home
  sethome:
    description: Set a home.
    usage: /sethome [name]
    permission: rihanx.home.set
  delhome:
    description: Delete a home.
    usage: /delhome [name]
    permission: rihanx.home.delete
  homes:
    description: List your homes.
    usage: /homes
    permission: rihanx.home.list
  warp:
    description: Teleport to a warp (also /rx warp).
    usage: /warp <name>
    permission: rihanx.warp
  setwarp:
    description: Set a server warp.
    usage: /setwarp <name>
    permission: rihanx.warp.set
  delwarp:
    description: Delete a server warp.
    usage: /delwarp <name>
    permission: rihanx.warp.delete
  warps:
    description: List warps.
    usage: /warps
    permission: rihanx.warp.list
  tpa:
    description: Request to teleport to a player.
    usage: /tpa <player>
    permission: rihanx.tpa
  tpahere:
    description: Request a player to teleport to you.
    usage: /tpahere <player>
    permission: rihanx.tpa.here
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept
    permission: rihanx.tpa.accept
  tpdeny:
    description: Deny a teleport request.
    usage: /tpdeny
    permission: rihanx.tpa.deny
  tpcancel:
    description: Cancel your outgoing teleport request.
    usage: /tpcancel
    permission: rihanx.tpa.cancel
  kit:
    description: Claim a kit.
    usage: /kit <name>
    permission: rihanx.kit
  kits:
    description: List kits.
    usage: /kits
    permission: rihanx.kit.list
  msg:
    description: Send a private message to a player.
    usage: /msg <player> <message>
    permission: rihanx.msg
    aliases: [tell, w]
  reply:
    description: Reply to the last player who messaged you (or you messaged).
    usage: /reply <message>
    permission: rihanx.reply
    aliases: [r]
  afk:
    description: Toggle your AFK status.
    usage: /afk
    permission: rihanx.afk
  spawn:
    description: Teleport to spawn.
    usage: /spawn
    permission: rihanx.spawn
  setspawn:
    description: Set the world spawn (and the "spawn" warp) to your location.
    usage: /setspawn
    permission: rihanx.setspawn
  base:
    description: Paste a house / base template (hut, cottage, bungalow, villa, village).
    usage: /base [hut|cottage|village|bungalow|villa|modern|mansion|resort|list|undo]
    permission: rihanx.base
    aliases: [house, buildbase]
  farm:
    description: Paste an automatic farm (wheat, cane, bamboo, melon, nether, animal, cactus, iron, xp).
    usage: /farm [wheat|potato|cane|bamboo|melon|cocoa|kelp|mushroom|nether|animal|cactus|iron|xp|list|undo]
    permission: rihanx.farm
    aliases: [autofarm, farms]
  station:
    description: Paste train stations/railways and link stops together.
    usage: /station [build <template> [stop]|set <stop>|link <a> <b>|stops|list|undo]
    permission: rihanx.station
    aliases: [train, railway, stations]
  portal:
    description: Create and link teleport portals between two locations.
    usage: /portal <create|link|delete|list|tp> …
    permission: rihanx.portal
    aliases: [portals, rxportal]
  bridge:
    description: Build a bridge in the direction you face (always undoable).
    usage: /bridge [length] [width] [material] | /bridge undo
    permission: rihanx.bridge
    aliases: [rxbridge, buildbridge]
  build:
    description: Builder tools hub (platform, plain, wall, cyl, sphere, tunnel, flatten, drain, undo).
    usage: /build <platform|plain|wall|pillar|cyl|hcyl|sphere|hsphere|tunnel|flatten|drain|bridge|undo> …
    permission: rihanx.build
    aliases: [rxbuild]
  platform:
    description: Build a cleared flat platform under you (removes trees/builds above; undoable).
    usage: /platform [size] [material] | /platform undo
    permission: rihanx.build.platform
    aliases: [pad]
  plain:
    description: Create a large cleared plain / build pad (clears everything above; undoable).
    usage: /plain [size] [material] | /plain undo
    permission: rihanx.build.platform
    aliases: [clearland, clearpad, plot]
  wall:
    description: Build a wall in front of you (always undoable).
    usage: /wall [length] [height] [material] | /wall undo
    permission: rihanx.build.wall
  pillar:
    description: Build a pillar up/down from your feet (always undoable).
    usage: /pillar [height] [material] | /pillar undo
    permission: rihanx.build.pillar
    aliases: [tower]
  cyl:
    description: Build a cylinder at your feet (always undoable).
    usage: /cyl <radius> [height] [material] | /cyl undo
    permission: rihanx.build.cyl
    aliases: [cylinder]
  hcyl:
    description: Build a hollow cylinder at your feet (always undoable).
    usage: /hcyl <radius> [height] [material] | /hcyl undo
    permission: rihanx.build.cyl
    aliases: [hcylinder]
  sphere:
    description: Build a sphere at your position (always undoable).
    usage: /sphere <radius> [material] | /sphere undo
    permission: rihanx.build.sphere
  hsphere:
    description: Build a hollow sphere at your position (always undoable).
    usage: /hsphere <radius> [material] | /hsphere undo
    permission: rihanx.build.sphere
  tunnel:
    description: Dig a tunnel forward (always undoable).
    usage: /tunnel [length] [width] [height] [lining] | /tunnel undo
    permission: rihanx.build.tunnel
  flatten:
    description: Flatten a circular area to your Y and clear above (always undoable).
    usage: /flatten [radius] | /flatten undo
    permission: rihanx.build.flatten
    aliases: [level]
  drain:
    description: Drain water/lava in a radius (always undoable).
    usage: /drain [radius] | /drain undo
    permission: rihanx.build.drain
  pyramid:
    description: Build a pyramid at your feet (always undoable).
    usage: /pyramid <size> [material] | /pyramid undo
    permission: rihanx.build.pyramid
  hpyramid:
    description: Build a hollow pyramid at your feet (always undoable).
    usage: /hpyramid <size> [material] | /hpyramid undo
    permission: rihanx.build.pyramid
  stairs:
    description: Build a staircase forward/up (always undoable).
    usage: /stairs [length] [width] [material] | /stairs undo
    permission: rihanx.build.stairs
    aliases: [stair]
  stack:
    description: Repeat your edit selection in a direction (always undoable).
    usage: /stack <count> [direction]
    permission: rihanx.build.stack
    aliases: [rxstack]

