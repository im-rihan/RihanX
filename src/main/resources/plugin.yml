name: RihanX
version: '${project.version}'
main: com.rihanx.RihanX
api-version: '1.21'
description: Production-ready Paper utility suite — slime, world, find, chunk, teleport, player, inventory, items, search, and performance tools.
author: Rihan
website: https://github.com/im-rihan/RihanX
folia-supported: false
load: POSTWORLD

commands:
  rihanx:
    description: RihanX root command. Use /rx help for modules.
    usage: /rihanx <module> [args...]
    permission: rihanx.use
    aliases: [rx, rihan]

permissions:
  rihanx.*:
    description: All RihanX permissions.
    default: op
    children:
      rihanx.use: true
      rihanx.admin: true
      rihanx.slime.*: true
      rihanx.world.*: true
      rihanx.find.*: true
      rihanx.chunk.*: true
      rihanx.tp.*: true
      rihanx.player.*: true
      rihanx.inventory.*: true
      rihanx.item.*: true
      rihanx.search.*: true
      rihanx.server.*: true
      rihanx.performance.*: true
  rihanx.use:
    description: Access the /rihanx root command.
    default: true
  rihanx.admin:
    description: Admin reload, debug, cache, and config tools.
    default: op
  rihanx.slime:
    description: Base slime module.
    default: true
  rihanx.slime.*:
    description: All slime subcommands.
    default: op
    children:
      rihanx.slime: true
      rihanx.slime.nearest: true
      rihanx.slime.search: true
      rihanx.slime.density: true
      rihanx.slime.map: true
      rihanx.slime.tp: true
  rihanx.slime.nearest:
    default: true
  rihanx.slime.search:
    default: true
  rihanx.slime.density:
    default: true
  rihanx.slime.map:
    default: true
  rihanx.slime.tp:
    default: op
  rihanx.world:
    default: true
  rihanx.world.*:
