# RihanX kits — claim with /kit <name>
# Auto-places colored shulker boxes filled with gear (starter=white, survival=lime, pro=purple)
#
# Item format: MATERIAL:amount  OR  MATERIAL:amount:enchant1:level1:enchant2:level2...
#   e.g. DIAMOND_SWORD:1:sharpness:5:unbreaking:3
#
# cooldown-seconds is the wait time between /kit <name> claims for that kit, per player.
#   3600 = 1 hour | 86400 = 24 hours | 172800 = 48 hours
# (pro is set to 172800 = 48 hours between claims)

