# RihanX Configuration
# Paper API: 26.2.build.84-stable | Java 25

prefix: "<gradient:#7C4DFF:#00E5FF><bold>RihanX</bold></gradient> <dark_gray>Â»</dark_gray> "

search:
  default-radius: 32
  max-radius: 128
  max-results: 50
  progress-interval: 64
  timeout-seconds: 120
  structure-radius-blocks: 6400
  biome-step-blocks: 32
  biome-max-radius-blocks: 6400
  block-search-radius: 64
  block-search-step: 4

teleport:
  delay-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true
  particles: true
  sound: true
  sound-name: ENTITY_ENDERMAN_TELEPORT
  sound-volume: 1.0
  sound-pitch: 1.0
  safe-teleport: true
  safe-teleport-max-y: 32
  random-max-range: 2000

cooldowns:
  slime: 2
  find: 10
  search: 15
  teleport: 5
  random-tp: 30

slime:
  nearest-radius: 64
  default-map-radius: 8
  max-map-radius: 32
  map-slime-char: "S"
  map-empty-char: "."
  map-player-char: "P"

particles:
  enabled: true
  teleport-warmup: PORTAL
  teleport-warmup-count: 10
  teleport-arrive: ENDER_SIGNAL
  teleport-arrive-count: 24
  vanish: SMOKE
  freeze: SNOWFLAKE

database:
  enabled: false
  type: sqlite
  sqlite-file: rihanx.db
  mysql-host: localhost
  mysql-port: 3306
  mysql-database: rihanx
  mysql-username: root
  mysql-password: ""
  pool-size: 5

general:
  debug: false
  # Forced to Asia/Kolkata (IST) â€” RihanX always uses India time for /server info
  timezone: Asia/Kolkata
  persistent-back: true
  max-back-history: 10
  unfreeze-on-quit: true
  unvanish-on-quit: false
  # Keep fly/god after disconnect/rejoin (and across restarts via player-states.yml)
  ungod-on-quit: false
  unfly-on-quit: false
  language-file: messages.yml

cache:
  search-ttl-seconds: 300
  location-ttl-seconds: 600
  max-entries: 1000

performance:
  entity-report-limit: 25
  chunk-report-radius: 8

protection:
  enabled: true
  max-regions-per-world: 200
  default-world-flags:
    tnt: deny
    creeper-explosion: deny
    other-explosion: deny
    fire-spread: deny
    fire-destroy: deny
    lava-fire: deny
    mob-grief: deny
    enderman-grief: deny
    leaf-decay: allow
    ice-melt: allow
    crop-trample: deny
    build: allow
    break: allow
    place: allow
    pvp: allow
    entry: allow

item:
  enchant:
    require-xp: true
    # XP levels charged = clamp(base + enchantLevel * per-level, 1, max-cost)
    base-cost: 0
    cost-per-enchant-level: 1
    max-cost: 30
    # Players with rihanx.item.enchant.free skip the XP charge
    allow-free-permission: true

edit:
  max-blocks: 200000
  max-undo: 10
  physics: false
  # Blocks changed per tick for large edits (prevents TPS stalls)
  blocks-per-tick: 4000
  # Ask for GUI confirm when selection volume exceeds this
  confirm-above: 50000
  max-stack: 50

# Night only becomes day when every required online player is sleeping
sleep:
  enabled: true
  players-sleeping-percentage: 100
  # true  = only players in the same overworld must sleep (recommended)
  # false = every overworld player on the server must sleep
  same-world-only: true
  # Nether/End players never block overworld sunrise (beds explode there)
  ignore-other-dimensions: true
  ignore-spectators: true
  ignore-vanished: true
  ignore-creative: false

homes:
  max-default: 3
  max-op: 20
warps: {}
tpa:
  timeout-seconds: 60
  cooldown-seconds: 5
kits:
  # definitions live in kits.yml
  persist-cooldowns: true
  # Keep starter + survival + pro kits updated from the plugin jar on reload
  sync-bundled: true
  # How kits are delivered:
  #   auto       = plugin auto-creates filled kit shulkers near you (default)
  #   shulker    = gives portable filled kit-chest item(s) in inventory
  #   inventory  = dump loose items into your inventory
  delivery: auto
  # Kit name given automatically 1 second (20 ticks) after a brand-new player's first join.
  # Leave blank ("") to disable.
  first-join-kit: starter

base:
  # How many blocks to place per tick when pasting a house template
  blocks-per-tick: 1200
  # How many pastes each player can undo (newest first)
  max-undo: 5

# Train stations — /station link builds a powered rail path between stops
station:
  # Skip pad cells; join back into each station platform, then exit toward the other stop
  rail-margin: 1
  rail-join-length: 8
  rail-exit-length: 3
  powered-every: 4
  max-rail-distance: 512
  rail-link: true


bridge:
  default-length: 16
  default-width: 3
  default-material: oak_planks
  max-length: 128
  max-width: 15
  # How many bridge builds each player can undo (newest first)
  max-undo: 10
  blocks-per-tick: 2000
  # Place fences/walls along both edges
  railings: true

build:
  blocks-per-tick: 2000
  max-undo: 10
  platform:
    default-size: 16
    max-size: 96
    default-material: grass_block
    # Blocks of air cleared above the floor (trees, hills, leftover builds)
    clear-height: 48
  plain:
    default-size: 32
    max-size: 96
    default-material: grass_block
    clear-height: 64
  wall:
    default-length: 16
    default-height: 4
    max-length: 128
    max-height: 64
    default-material: stone_bricks
  pillar:
    default-height: 16
    max-height: 64
    default-material: stone
  cyl:
    default-radius: 5
    default-height: 1
    max-radius: 32
    max-height: 64
    default-material: stone
  sphere:
    default-radius: 5
    max-radius: 32
    default-material: stone
  tunnel:
    default-length: 16
    default-width: 3
    default-height: 3
    max-length: 128
    max-width: 15
    max-height: 15
    default-lining: false
    default-material: stone
  flatten:
    default-radius: 16
    max-radius: 96
    default-material: grass_block
    clear-height: 48
  drain:
    default-radius: 8
    max-radius: 64
  pyramid:
    default-size: 5
    max-size: 32
    default-material: sandstone
  stairs:
    default-length: 8
    default-width: 3
    max-length: 64
    max-width: 15
    default-material: oak_stairs
  bridge:
    default-length: 16
    default-width: 3
    default-material: oak_planks
    max-length: 128
    max-width: 15
    railings: true
